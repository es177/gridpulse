name: Refresh snapshot

# Keeps api/data/snapshot.json, the data a cold server instance starts from, at most a week
# old, and doubles as a weekly check that every upstream source still parses. Live data does
# not depend on this: the API refreshes each source on its own schedule.
on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Refresh every source
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}  # optional; EIA's keyless endpoints are the fallback
        run: |
          python scripts/refresh_snapshot.py | tee refresh.txt || true
          { echo '```'; cat refresh.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "FAILED=$(grep -c ' FAIL ' refresh.txt || true)" >> "$GITHUB_ENV"
      - name: Commit if changed
        run: |
          git config user.name Anonymous
          git config user.email anonymous@example.invalid
          git add api/data/snapshot.json
          git diff --cached --quiet || { TZ=UTC git commit -q -m "Refresh cold-start snapshot" && git push -q; }
      # A source or two can be unreachable from CI runners; a broad failure means a parser broke.
      - name: Fail if many sources failed
        if: env.FAILED > 4
        run: echo "${FAILED} sources failed; see the summary" && exit 1
